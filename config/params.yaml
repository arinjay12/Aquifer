symbol_spot: "ETHUSDT"
symbol_perp: "ETHUSDT"
venue: "binance"

data:
  start_date: "2024-01-01"
  end_date: null
  interval: "1m"

strategy:
  entry_edge_bps: 15.0
  min_basis_bps: 5.0
  exit_edge_bps: 2.0
  exit_basis_bps: 1.0
  hard_stop_basis_widen_bps: 25.0
  max_holding_hours: 48
  min_minutes_to_next_funding: 10
  positive_funding_only: true

costs:
  baseline:
    spot_fee_bps_per_side: 10.0
    perp_fee_bps_per_side: 5.0
    spot_slippage_bps_per_side: 1.0
    perp_slippage_bps_per_side: 1.0
    capital_mode: "isolated"
  optimistic:
    spot_fee_bps_per_side: 5.0
    perp_fee_bps_per_side: 2.0
    spot_slippage_bps_per_side: 0.5
    perp_slippage_bps_per_side: 0.5
    capital_mode: "cross"

live:
  poll_seconds: 60
  output_csv: "outputs/live_logs/live_signal_log.csv"

risk:
  position_fraction: 1.0
  max_drawdown_pause_pct: 10.0
  pause_minutes: 240
  confidence_scale_bps: 10.0
